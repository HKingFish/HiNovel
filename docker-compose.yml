services:
  # MySQL 8.x
  mysql:
    image: ${DOCKER_IMAGE_MYSQL:-mysql:8.0}
    container_name: hinovel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${MYSQL_PASSWORD:-}}
      MYSQL_DATABASE: ${MYSQL_DB:-hinovel_platform}
      TZ: Asia/Shanghai
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ../data/mysql/data:/var/lib/mysql
      - ../data/mysql/conf:/etc/mysql/conf.d
      - ../data/mysql/logs:/var/log/mysql
      - ./hinovel-server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./hinovel-server/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u root -D "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null
      start_period: 45s
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hinovel-network

  # Redis 7.x
  redis:
    image: ${DOCKER_IMAGE_REDIS:-redis:7.2-alpine}
    container_name: hinovel-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -ec
      - |
        set -- redis-server --appendonly yes
        if [ -n "$$REDIS_PASSWORD" ]; then set -- "$$@" --requirepass "$$REDIS_PASSWORD"; fi
        exec docker-entrypoint.sh "$$@"
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - ../data/redis/data:/data
      - ../data/redis/conf:/usr/local/etc/redis
    healthcheck:
      test:
        - CMD-SHELL
        - if [ -n "$$REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$REDIS_PASSWORD"; fi; [ "$$(redis-cli ping)" = PONG ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hinovel-network

  # Qdrant 向量数据库
  qdrant:
    image: ${DOCKER_IMAGE_QDRANT:-qdrant/qdrant:v1.12.5}
    container_name: hinovel-qdrant
    restart: unless-stopped
    ports:
      - "${INFRA_BIND_IP:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${INFRA_BIND_IP:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - ../data/qdrant/storage:/qdrant/storage
      - ../data/qdrant/snapshots:/qdrant/snapshots
    healthcheck:
      test: ["CMD", "bash", "-ec", "true </dev/tcp/127.0.0.1/6333; true </dev/tcp/127.0.0.1/6334"]
      interval: 10s
      timeout: 8s
      retries: 5
    networks:
      - hinovel-network

  # 后端 Spring Boot 应用
  hinovel-server:
    build:
      context: ./hinovel-server
      dockerfile: Dockerfile
      args:
        MAVEN_IMAGE: ${DOCKER_IMAGE_MAVEN:-maven:3.9.6-eclipse-temurin-21}
        JRE_IMAGE: ${DOCKER_IMAGE_JRE:-eclipse-temurin:21-jre-alpine}
    container_name: hinovel-server
    restart: unless-stopped
    ports:
      - "${SERVER_BIND_IP:-127.0.0.1}:${SERVER_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      HINOVEL_LOG_FILE: /app/logs/hinovel.log
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: ${MYSQL_DB:-hinovel_platform}
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-${MYSQL_ROOT_PASSWORD:-}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6334
      OSS_TYPE: ${OSS_TYPE:-LOCAL}
      OSS_LOCAL_PATH: /data/hinovel/uploads
      OSS_LOCAL_URL_PREFIX: ${OSS_LOCAL_URL_PREFIX:-/files}
      OSS_ALIYUN_ENDPOINT: ${OSS_ALIYUN_ENDPOINT:-}
      OSS_ALIYUN_ACCESS_KEY_ID: ${OSS_ALIYUN_ACCESS_KEY_ID:-}
      OSS_ALIYUN_ACCESS_KEY_SECRET: ${OSS_ALIYUN_ACCESS_KEY_SECRET:-}
      OSS_ALIYUN_BUCKET_NAME: ${OSS_ALIYUN_BUCKET_NAME:-}
      API_KEY_SECRET: ${API_KEY_SECRET:-}
      HINOVEL_MACHINE_ID: ${HINOVEL_MACHINE_ID:-1}
    volumes:
      - ../data/hinovel/uploads:/data/hinovel/uploads
      - ../data/hinovel/logs:/app/logs
      - ../data/models:/data/models
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - '[ "$$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8080/api/user/auth/me)" = 401 ]'
      start_period: 30s
      interval: 5s
      timeout: 10s
      retries: 5
    networks:
      - hinovel-network

  # 前端 Vue 应用（Nginx）
  # 说明：前端产物 dist/ 由宿主机通过 npm run build 预先构建，镜像仅托管静态文件
  hinovel-web:
    build:
      context: ./hinovel-web
      dockerfile: Dockerfile
      args:
        NGINX_IMAGE: ${DOCKER_IMAGE_NGINX:-nginx:1.25-alpine}
    container_name: hinovel-web
    restart: unless-stopped
    ports:
      # 默认 3000 避免与服务器已有 nginx/apache 80 端口冲突；如需 80，在 .env 设置 WEB_PORT=80
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    volumes:
      - ../data/nginx/logs:/var/log/nginx
    depends_on:
      hinovel-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hinovel-network

networks:
  hinovel-network:
    driver: bridge
